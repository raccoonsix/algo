[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atr"
version = "0.0.1"
description = "AI-Assisted Algorithmic Trading Research System (research and simulation only)"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = { text = "Proprietary" }
authors = [{ name = "Owner" }]
keywords = ["research", "backtesting", "paper-trading", "crypto"]
classifiers = [
  "Private :: Do Not Upload",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "pandas==3.1.0",
  "numpy==2.5.4",
  "pyarrow==26.0.0",
  "pydantic==2.14.1",
  "pyyaml==6.0.3",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
  "pytest==9.2.0",
  "hypothesis==6.170.12",
  "ruff==0.17.3",
  "mypy==2.4.0",
  "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
atr = "atr.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "network: tests that hit the real network (excluded from make check)",
  "llm: tests that call a real LLM provider (excluded from make check)",
  "slow: long-running tests (excluded from make check)",
]
# make check runs everything EXCEPT network, llm, slow (TEST_PLAN §2):
#   pytest -m "not network and not llm and not slow"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs", "data", "reports"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # isort
  "W",   # pycodestyle warnings
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
  "SIM", # flake8-simplify
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
show_error_codes = true
